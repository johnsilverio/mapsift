[package]
name = "mapsift-core"
version = "0.1.0"
edition = "2024"
description = "The Mapsift client logic core: operation queue, optimistic apply, optimistic conflict detection, client geometry. Runs on clients only, never on the server."
publish = false

[lib]
# cdylib for wasm-pack and the future FFI library, rlib so `cargo test` can link the pure logic.
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std"] }
geo = "0.33.1"
schemars = { version = "1.2.2", features = ["uuid1", "chrono04"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tsify = { version = "0.5.6", features = ["js"] }
uuid = { version = "1.24.0", features = ["serde"] }
wasm-bindgen = "0.2.126"

[profile.release]
# The artifact is downloaded by a field tablet on a bad connection (PRD S4).
opt-level = "s"
lto = true
