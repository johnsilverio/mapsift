[project]
name = "mapsift-api"
version = "0.1.0"
description = "Mapsift backend: the one Django service. Truth, auth, tenant isolation, ordering, and the authoritative conflict resolution."
# Ceiling capped by Celery, whose supported list stops at 3.13 (specs/dependencies.md).
requires-python = ">=3.13,<3.14"
dependencies = [
    "django~=5.2.0",
    "django-ninja>=1.6.2",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
]

[dependency-groups]
dev = [
    # The generator and the formatter it is told to call are pinned exactly and moved together,
    # because their output is a committed artifact the `--check` gate diffs (ADR-0009 section 2).
    "datamodel-code-generator==0.72.1",
    "django-stubs[compatible-mypy]>=6.0.7",
    "import-linter>=2.13",
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "ruff==0.16.1",
]

# The gates of ADR-0001 section 6.

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting, so no separate isort is needed
    "UP",      # pyupgrade, keeps syntax at the pinned interpreter's level
    "B",       # bugbear
    "SIM",     # simplify
    "C4",      # comprehensions
    "DTZ",     # naive datetimes, which matter where created-at and applied-at are distinct (T5.3)
    "T20",     # no stray print, since the observability rule is structured logging (N9)
    "RUF",
    "ANN",     # C5 as a lint rule: every signature complete
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN201", "ANN001"]
# The generated envelope reader carries the rustdoc from libs/core across as field descriptions,
# and a long string literal is the one thing the formatter will not wrap. The file is generated
# and never hand-edited (M12, ADR-0009 section 2), so the only place a wrap could be applied is
# the Rust doc comment, which is the contract's documentation rather than this file's formatting.
"mapsift/sync/envelope.py" = ["E501"]

[tool.ruff.lint.isort]
# Ruff infers first-party from what is on disk, so an app a red test names before window B
# generates it sorts as third-party and then moves the day it appears, which would put a lint
# failure inside a file that window may not edit. `conftest` never resolves on its own because
# tests/ is not a source root.
known-first-party = ["mapsift", "config", "conftest"]

[tool.mypy]
strict = true
# Two plugins, two jobs: the Django one teaches the ORM and the settings, the Pydantic one
# teaches that a model coerces its input.
plugins = ["mypy_django_plugin.main", "pydantic.mypy"]
python_version = "3.13"
exclude = ["\\.venv"]
disallow_any_explicit = false
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["config.wsgi", "config.asgi"]
disallow_untyped_defs = false

[tool.pydantic-mypy]
# A settings object is populated from the environment, so its constructor legitimately takes
# no arguments and accepts the raw forms it coerces.
init_typed = false
init_forbid_extra = false
warn_required_dynamic_aliases = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
testpaths = ["tests", "mapsift"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers --strict-config"
# MAP-3 brought the first ORM-dependent tests, so this is on. pytest-django calls django.setup()
# before any conftest.py loads, which is why the environment has to reach the process from outside
# (compose supplies it) and cannot be arranged by a fixture.
DJANGO_SETTINGS_MODULE = "config.settings"
# The suite-wide net for a hang, and the whole of what this project takes for one: pytest-timeout
# is refused and this pair replaces it at no dependency (specs/dependencies.md section 1,
# 2026-08-18). The value is a wide margin over the slowest test measured in this container
# (0.61 s, 2026-08-18) and, deliberately, over every bound a case sets for itself, because a
# backstop that fires first replaces that case's own diagnosis with a stack dump.
faulthandler_timeout = 60
faulthandler_exit_on_timeout = true

# The dependency direction of ADR-0007 section 4, as a gate rather than a review item.
[tool.importlinter]
root_package = "mapsift"

[[tool.importlinter.contracts]]
name = "Mapsift package tiers"
type = "layers"
containers = ["mapsift"]
layers = ["sync", "layers", "accounts", "common"]
exhaustive = true

# One contract per package, and the split is load-bearing rather than tidy: a `protected` contract
# applies every allowed importer to every protected module, so a single contract naming both
# packages would let `layers` import `accounts.models`, which is what it exists to forbid.
# `protected` also has no `exhaustive` option, so a package added later is silently outside this
# gate; `tests/test_dependency_direction.py` is what closes that.
[[tool.importlinter.contracts]]
name = "accounts is reached through its selectors and services, never its models"
type = "protected"
protected_modules = ["mapsift.accounts.models"]
allowed_importers = ["mapsift.accounts"]

[[tool.importlinter.contracts]]
name = "layers is reached through its selectors and services, never its models"
type = "protected"
protected_modules = ["mapsift.layers.models"]
allowed_importers = ["mapsift.layers"]

[[tool.importlinter.contracts]]
name = "sync is reached through its selectors and services, never its models"
type = "protected"
protected_modules = ["mapsift.sync.models"]
allowed_importers = ["mapsift.sync"]
