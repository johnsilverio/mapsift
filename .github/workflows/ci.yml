# The gates of ADR-0001 section 6, which exist before there is meaningful code in them because a
# gate added later is a gate that arrives after the violations.
#
# Every job runs its checks inside the same image the developer runs, built from the same
# Dockerfile (ADR-0001 section 3). CI does not use infra/compose.yaml: that file bind-mounts the
# source for hot reload and runs as uid 1000, neither of which is true of a runner. What has to
# match is the environment, and the environment is the image.
#
# Not cached yet, deliberately. Layer caching across runs needs a registry or the buildx GitHub
# cache backend, which is complexity bought with a measurement rather than a hunch (foundation
# section 10), and the measurement is the first real run of this workflow.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: apps/api
    runs-on: ubuntu-latest
    env:
      # The settings module validates its environment at import, and django-stubs builds its mypy
      # plugin by importing that module, so a missing variable surfaces as `INTERNAL ERROR -- Error
      # constructing plugin instance`, which reads like a broken type checker and is nothing of the
      # sort. The lint and type steps still never open a connection; the suite does, since MAP-3.
      # No production value exists outside production (C6, I7).
      SECRET_KEY: ci-not-a-secret
      DB_OWNER_PASSWORD: ci-not-a-secret
      # The suite connects as the migrate role of ADR-0005 section 2, never as the superuser, and
      # its first test asserts exactly that: a superuser walks through the wall as if it were not
      # there, so a suite running as one proves nothing it claims to prove.
      DATABASE_URL: postgresql://mapsift_owner:ci-not-a-secret@db:5432/mapsift
    steps:
      - uses: actions/checkout@v7

      - name: Build the API image
        run: docker build --target dev -f infra/docker/api.Dockerfile -t mapsift-api .

      # Not a `services:` block, and the reason is mechanical rather than stylistic: GitHub starts
      # service containers BEFORE the checkout, so the provisioning script this repository owns is
      # not on disk yet and cannot be mounted. Running the container here uses the same image and
      # the same script the compose file does, which is the parity ADR-0001 section 3 asks for.
      - name: Start the database, provisioned the way compose provisions it
        run: |
          docker network create ci
          docker run --detach --name db --network ci \
            --env POSTGRES_DB=mapsift \
            --env POSTGRES_USER=mapsift \
            --env POSTGRES_PASSWORD=mapsift \
            --env DB_OWNER_PASSWORD \
            --volume "$PWD/infra/docker/db/30-mapsift-owner.sh:/docker-entrypoint-initdb.d/30-mapsift-owner.sh:ro" \
            postgis/postgis:18-3.6

      # Waiting on `pg_isready` is the trap here: during initialisation the server is already up on
      # the unix socket while the init scripts are still running, so it answers ready before the
      # role below exists. Wait for the thing the suite actually needs.
      - name: Wait until provisioning has finished
        run: |
          for _ in $(seq 60); do
            if docker exec db psql -U mapsift -d mapsift -tAc \
              "SELECT 1 FROM pg_roles WHERE rolname = 'mapsift_owner'" 2>/dev/null | grep -q 1; then
              exit 0
            fi
            sleep 1
          done
          echo "the database never finished provisioning"; docker logs db; exit 1

      - name: Lint
        run: docker run --rm -e SECRET_KEY -e DATABASE_URL mapsift-api ruff check .

      - name: Format check
        run: docker run --rm -e SECRET_KEY -e DATABASE_URL mapsift-api ruff format --check .

      - name: Import contracts
        run: docker run --rm -e SECRET_KEY -e DATABASE_URL mapsift-api lint-imports

      - name: Type check
        run: docker run --rm -e SECRET_KEY -e DATABASE_URL mapsift-api mypy --strict .

      - name: Test
        run: docker run --rm --network ci -e SECRET_KEY -e DATABASE_URL mapsift-api pytest

      # The Python half of the generated-contract rule (ADR-0001 section 5, ADR-0009 section 2).
      # The schema is mounted rather than copied into the image because this image is apps/api's
      # and sees nothing of libs/core. The output path is the one that must not move: ruff
      # discovers its configuration by walking up from the file it formats, so an output outside
      # apps/api formats at ruff's default width of 88 instead of this project's 100 and fails
      # --check against a file that is not stale at all.
      - name: Contract freshness, the envelope reader against the schema
        run: |
          docker run --rm --volume "$PWD/libs/core/schema:/schema:ro" mapsift-api \
            datamodel-codegen \
              --input /schema/envelope.schema.json \
              --input-file-type jsonschema \
              --output mapsift/sync/envelope.py \
              --output-model-type pydantic_v2.BaseModel \
              --target-python-version 3.13 \
              --use-annotated \
              --use-union-operator \
              --use-title-as-name \
              --disable-timestamp \
              --formatters ruff-check ruff-format \
              --check

  core:
    name: libs/core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Building this target runs wasm-pack, so the WebAssembly artifact and the TypeScript
      # definitions generated from the Rust types are proven by the build itself. That is the
      # core half of the generated-contract rule (ADR-0001 section 5, PRD M12); the OpenAPI half
      # has no artifact yet, because apps/api has no schema consumer.
      - name: Build the core image, which compiles the wasm package
        run: docker build --target core-build -f infra/docker/client.Dockerfile -t mapsift-core .

      - name: Format check
        run: docker run --rm mapsift-core cargo fmt --check

      - name: Lint
        run: docker run --rm mapsift-core cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: docker run --rm mapsift-core cargo test --locked

      # The schema is a committed artifact, so it drifts the moment the Rust types move without
      # it. The diff runs on the runner rather than in the image, which keeps `diff` off the
      # toolchain image's dependency list (ADR-0009 section 2).
      - name: Contract freshness, the schema against the Rust types
        run: |
          docker run --rm mapsift-core cargo run --locked --quiet --bin emit-envelope-schema \
            | diff -u libs/core/schema/envelope.schema.json -

  web:
    name: apps/web and libs/ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # This target runs `ng build ui && ng build web`, and `ng build` is the strict tsc pass, so
      # a type error fails the image build rather than a later step (C5).
      - name: Build the client image, which builds the library and the web client
        run: docker build --target web -f infra/docker/client.Dockerfile -t mapsift-web .

      # `ng build` is not the linter, and ADR-0001 section 6 blocks a change on both.
      - name: Lint
        run: docker run --rm mapsift-web npx ng lint

      - name: Test
        run: docker run --rm mapsift-web npx ng test --watch=false
